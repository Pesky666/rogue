<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROLL 1dEVERYTHING</title></head>
<body style="margin:0;background:#080907;color:#f4f4ef;font-family:monospace">Loading ROLL 1dEVERYTHING…
<script>
(async()=>{try{const files=['0.txt','1.txt','2.txt','3.txt'];const b64=(await Promise.all(files.map(f=>fetch('./game/'+f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.text()})))).join('');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}catch(e){console.error(e);document.body.textContent='Unable to load game: '+e.message}})();
</script></body></html>
